version = 1

[[annotations]]
path = ["README.md", "docs/*.md", "AUTHORS", "NOTICE", ".gitignore", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md"]
SPDX-FileCopyrightText = "nirapod-sha2 contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
SPDX-FileCopyrightText = "Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["tests/vectors/cavp/*.rsp"]
SPDX-FileCopyrightText = "National Institute of Standards and Technology; not subject to copyright in the United States"
SPDX-License-Identifier = "NIST-Software"

[[annotations]]
path = ["tests/vectors/wycheproof/*.json"]
SPDX-FileCopyrightText = "Wycheproof contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["tests/vectors/**/SHA256SUMS"]
SPDX-FileCopyrightText = "nirapod-sha2 contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["ci/safety-config/*.json"]
SPDX-FileCopyrightText = "nirapod-sha2 contributors"
SPDX-License-Identifier = "Apache-2.0"

# EasyCrypt models generated by tests/extraction/models.py from src/
# (jasmin2ec output, byte for byte, so they carry no comment of their own).
[[annotations]]
path = ["proofs/extracted/**"]
SPDX-FileCopyrightText = "nirapod-sha2 contributors"
SPDX-License-Identifier = "Apache-2.0"

# The digest manifest tests/xarch writes and the recorded Armv8-A
# instruction run of tests/insn/aarch64; none carries a comment of its own.
[[annotations]]
path = ["tests/vectors/xarch/manifest.txt", "tests/insn/aarch64/*.s", "tests/insn/aarch64/*.txt"]
SPDX-FileCopyrightText = "nirapod-sha2 contributors"
SPDX-License-Identifier = "Apache-2.0"
